services:
  # 1. PostgreSQL Local Database
  poupame_db:
    image: postgres:16-alpine
    container_name: poupame_postgres_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poupame_dev_db
    ports:
      - "5432:5432"
    volumes:
      - poupame_db_data:/var/lib/postgresql/data
    networks:
      - poupame_network

  # 2. Backend (Node.js API with DDD)
  poupame_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poupame_backend_local
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # Host changed to poupame_db to match the service name smoothly
      - DATABASE_URL=postgres://postgres:postgres@poupame_db:5432/poupa-me_dev_db
    depends_on:
      - poupame_db
    networks:
      - poupame_network

  # 3. Frontend (Angular 21)
  poupame_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poupame_frontend_local
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - BACKEND_URL=http://poupame_backend:3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - poupame_network

  # 4. Storybook (Design System UI Documentação)
  poupame_storybook:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poupame_storybook_local
    command: ["npm", "run", "storybook"]
    ports:
      - "6006:6006"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - poupame_network

  # 5. Ngrok Tunneling (para testar no telemóvel)
  poupame_ngrok:
    image: ngrok/ngrok:latest
    container_name: poupame_ngrok_local
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: "http poupame_frontend:4200 --host-header=localhost"
    ports:
      - "4040:4040" # Acesso à Web Interface do Ngrok
    depends_on:
      - poupame_frontend
    networks:
      - poupame_network

volumes:
  poupame_db_data:

networks:
  poupame_network:
    driver: bridge