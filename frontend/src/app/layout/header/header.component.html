<header class="app-header">

  <a routerLink="/" class="logo-link">
    <img src="/logos/logo_sem_fundo.png" alt="logo" class="logo">
    <h1>Poupa-Me</h1>
  </a>

  <!-- Banco Selector -->
  <div class="banco-selector">
    <a *ngIf="!isLoading() && sortedBancos().length === 0; else selectField"
       routerLink="/bancos/criar" class="banco-empty-link">
      <span>Criar o primeiro banco</span>
      <app-icon name="Plus" [size]="16"></app-icon>
    </a>

    <ng-template #selectField>
      <app-select
        [options]="bancoOptions()"
        [placeholder]="isLoading() ? 'A carregar bancos...' : 'Selecionar Banco'"
        [ngModel]="selectedBancoId()"
        (ngModelChange)="onBancoChange($event)">
      </app-select>
    </ng-template>
  </div>

</header>
