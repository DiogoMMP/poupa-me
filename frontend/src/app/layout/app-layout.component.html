<div class="app-shell">

  <!-- Mobile overlay — closes sidebar on tap -->
  <div class="sidebar-overlay"
       [class.visible]="sidebarOpen()"
       (click)="closeSidebar()">
  </div>

  <!-- Sidebar esquerda -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <app-header></app-header>
    <app-nav (click)="closeSidebar()"></app-nav>
    <app-footer></app-footer>
  </aside>

  <!-- Conteúdo principal -->
  <div class="main-wrapper">
    <!-- Mobile hamburger button -->
    <button class="hamburger" (click)="toggleSidebar()" aria-label="Abrir menu">
      <span></span><span></span><span></span>
    </button>

    <!-- global notifications -->
    <app-notifications></app-notifications>

    <!-- global confirmation dialog -->
    <app-confirm-dialog></app-confirm-dialog>

    <main class="content">
      <div class="banco-required-message" *ngIf="blocked()">
        <app-icon name="Bank" [size]="48" class="banco-required-icon"></app-icon>
        <ng-container *ngIf="showLoadingBancos()">
          <p>A carregar...</p>
        </ng-container>
        <ng-container *ngIf="showBancosLoadError()">
          <p>Não foi possível carregar os bancos.</p>
          <button type="button" (click)="retryLoadBancos()">Tentar novamente</button>
        </ng-container>
        <ng-container *ngIf="showSelectBancoPrompt()">
          <p>Selecione um banco no menu lateral para continuar.</p>
        </ng-container>
        <ng-container *ngIf="showCreateBancoPrompt()">
          <p>Ainda não tem nenhum banco. Crie um para começar a usar a aplicação.</p>
          <button type="button" routerLink="/bancos/criar">Criar banco</button>
        </ng-container>
      </div>
      <router-outlet *ngIf="!blocked()"></router-outlet>
    </main>
  </div>


</div>
