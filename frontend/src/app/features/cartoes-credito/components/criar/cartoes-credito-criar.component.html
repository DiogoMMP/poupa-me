<div class="page-container">
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Criar Cartão de Crédito</h1>
      <p class="form-subtitle">Preencha as informações do cartão</p>
    </div>

    <div *ngIf="vm.isLoading$ | async" class="loading-state">A carregar...</div>

    <form *ngIf="!(vm.isLoading$ | async)" [formGroup]="form" (ngSubmit)="onSubmit()" class="form-content">
      <div class="form-field">
        <label for="nome" class="form-label">Nome</label>
        <input
          type="text"
          id="nome"
          formControlName="nome"
          class="form-input"
          placeholder="Ex: Santander">
      </div>

      <div class="form-field">
        <label for="icon" class="form-label">Ícone</label>
        <div class="emoji-input-group">
          <input
            type="text"
            id="icon"
            formControlName="icon"
            class="form-input"
            placeholder="Emoji da conta"
            readonly>
          <button type="button" class="emoji-btn" (click)="toggleEmojiPicker()" title="Escolher emoji">
            <span class="emoji-btn-icon">{{ form.get('icon')?.value || '😀' }}</span>
          </button>
        </div>

        <!-- Picmo Emoji Picker Modal -->
        <div *ngIf="showEmojiPicker" class="emoji-modal-backdrop" (click)="closeEmojiPicker()">
          <div class="emoji-modal" (click)="$event.stopPropagation()">
            <div class="emoji-modal-header">
              <h3 class="emoji-modal-title">Escolha um Emoji</h3>
              <button type="button" class="emoji-modal-close" (click)="closeEmojiPicker()">✕</button>
            </div>
            <div class="emoji-modal-body">
              <div #emojiPickerContainer class="picmo-container"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-field" formGroupName="limiteCredito">
        <label class="form-label">Limite de Crédito</label>
        <div class="row-controls">
          <input
            type="number"
            id="valor"
            formControlName="valor"
            class="form-input"
            placeholder="Ex: 20.00">

          <input
            type="text"
            id="currency"
            formControlName="moeda"
            class="form-input"
            value="EUR">
        </div>
      </div>

      <div class="form-field" formGroupName="saldoUtilizado">
        <label class="form-label">Saldo Utilizado</label>
        <div class="row-controls">
          <input
            type="number"
            id="valor"
            formControlName="valor"
            class="form-input"
            placeholder="Ex: 20.00">

          <input
            type="text"
            id="currency"
            formControlName="moeda"
            class="form-input"
            value="EUR">
        </div>
      </div>

      <div class="form-field" formGroupName="periodo">
        <label class="form-label">Período</label>
        <div class="row-controls">
          <label for="dataInicio" class="form-label">Início: </label>
          <input
            type="date"
            id="dataInicio"
            formControlName="dataInicio"
            class="form-input">

          <label for="dataFim" class="form-label">Fim: </label>
          <input
            type="date"
            id="dataFim"
            formControlName="dataFim"
            class="form-input">
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">Conta de Pagamento</label>
        <app-select formControlName="contaPagamentoId" placeholder="Selecione uma conta"
          [options]="(vm.contas$ | async | toSelectOptions)"></app-select>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="form.invalid || (vm.isLoading$ | async) || !vm.selectedBancoId">
          <app-icon name="FloppyDisk" [size]="16"></app-icon>
          <span>Guardar</span>
        </button>

        <button type="button" routerLink="/cartoes-credito" class="btn-secondary">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
