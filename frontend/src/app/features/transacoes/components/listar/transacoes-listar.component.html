<section class="page-container">

  <div class="page-header">
    <h1 class="page-title">Transações</h1>

    <div class="page-actions">
      <app-nova-transacao-menu [showCartaoOptions]="!!(vm.cartoes$ | async)?.length"></app-nova-transacao-menu>
    </div>
  </div>

  <div class="loading-state" *ngIf="vm.isLoading$ | async">A carregar...</div>

  <div class="transacoes-layout"
       [class.transacoes-layout--single]="!(vm.cartoes$ | async)?.length">

    <!-- ══════════ LEFT COLUMN - ACCOUNTS ══════════ -->
    <div class="transacoes-column">

      <div class="section-header">
        <h3 class="section-title">Transações de Contas</h3>
        <button class="filter-toggle-btn"
                (click)="showContaFilters = !showContaFilters"
                [class.active]="showContaFilters">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M3 7H21M6 12H18M10 17H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Filtros
          <span class="filter-badge" *ngIf="hasActiveContaFilters()">●</span>
        </button>
      </div>

      <!-- Account Filters -->
      <div class="filter-panel" *ngIf="showContaFilters">
        <div class="filter-row">
          <div class="filter-field">
            <label class="filter-label">Conta</label>
            <select [(ngModel)]="contaFilterForm.contaId">
              <option value="">Todas as contas</option>
              <option *ngFor="let c of vm.contas$ | async" [value]="c.id">{{ c.nome }}</option>
            </select>
          </div>
          <div class="filter-field">
            <label class="filter-label">Categoria</label>
            <select [(ngModel)]="contaFilterForm.categoriaId">
              <option value="">Todas as categorias</option>
              <option *ngFor="let cat of vm.categorias$ | async" [value]="cat.id">{{ cat.icon }} {{ cat.nome }}</option>
            </select>
          </div>
          <div class="filter-field">
            <label class="filter-label">Período</label>
            <select [(ngModel)]="contaFilterForm.period">
              <option value="">Qualquer período</option>
              <option *ngFor="let p of vm.PERIODS" [value]="p">{{ p }}</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn-secondary" (click)="clearContaFilters()">Limpar</button>
          <button (click)="applyContaFilters()">Aplicar</button>
        </div>
      </div>

      <!-- Paged list -->
      <ng-container *ngIf="vm.contaTransacoes$ | async as all">
        <div class="empty-state" *ngIf="all.length === 0">Sem transações de contas.</div>

        <div class="transacoes-list">
          <app-transacao-item
            *ngFor="let t of paginate(all, contaPage)"
            [transacao]="t"
            [showActions]="true"
            [showStatus]="false"
            editRoutePrefix="/transacoes/editar"
            (deleted)="onDelete($event)"
          ></app-transacao-item>
        </div>

        <!-- Accounts Pagination -->
        <app-pagination
          [currentPage]="contaPage"
          [totalItems]="all.length"
          [pageSize]="10"
          (pageChanged)="contaPage = $event"
        ></app-pagination>
      </ng-container>
    </div>

    <!-- ══════════ RIGHT COLUMN - CARDS ══════════ -->
    <div class="transacoes-column" *ngIf="(vm.cartoes$ | async)?.length">

      <div class="section-header">
        <h3 class="section-title">Transações de Cartões</h3>
        <button class="filter-toggle-btn"
                (click)="showCartaoFilters = !showCartaoFilters"
                [class.active]="showCartaoFilters">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M3 7H21M6 12H18M10 17H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Filtros
          <span class="filter-badge" *ngIf="hasActiveCartaoFilters()">●</span>
        </button>
      </div>

      <!-- Card Filters -->
      <div class="filter-panel" *ngIf="showCartaoFilters">
        <div class="filter-row">
          <div class="filter-field">
            <label class="filter-label">Cartão</label>
            <select [(ngModel)]="cartaoFilterForm.cartaoId">
              <option value="">Todos os cartões</option>
              <option *ngFor="let c of vm.cartoes$ | async" [value]="c.id">{{ c.nome }}</option>
            </select>
          </div>
          <div class="filter-field">
            <label class="filter-label">Categoria</label>
            <select [(ngModel)]="cartaoFilterForm.categoriaId">
              <option value="">Todas as categorias</option>
              <option *ngFor="let cat of vm.categorias$ | async" [value]="cat.id">{{ cat.icon }} {{ cat.nome }}</option>
            </select>
          </div>
          <div class="filter-field">
            <label class="filter-label">Estado</label>
            <select [(ngModel)]="cartaoFilterForm.status">
              <option value="">Todos os estados</option>
              <option *ngFor="let s of vm.STATUSES" [value]="s">{{ s }}</option>
            </select>
          </div>
          <div class="filter-field">
            <label class="filter-label">Período</label>
            <select [(ngModel)]="cartaoFilterForm.period">
              <option value="">Qualquer período</option>
              <option *ngFor="let p of vm.PERIODS" [value]="p">{{ p }}</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn-secondary" (click)="clearCartaoFilters()">Limpar</button>
          <button (click)="applyCartaoFilters()">Aplicar</button>
        </div>
      </div>

      <!-- Paged list -->
      <ng-container *ngIf="vm.cartaoTransacoes$ | async as all">
        <div class="empty-state" *ngIf="all.length === 0">Sem transações de cartões.</div>

        <div class="transacoes-list">
          <app-transacao-item
            *ngFor="let t of paginate(all, cartaoPage)"
            [transacao]="t"
            [showActions]="true"
            editRoutePrefix="/transacoes/editar"
            (deleted)="onDelete($event)"
          ></app-transacao-item>
        </div>

        <!-- Paginação Cartões -->
        <app-pagination
          [currentPage]="cartaoPage"
          [totalItems]="all.length"
          [pageSize]="10"
          (pageChanged)="cartaoPage = $event"
        ></app-pagination>
      </ng-container>
    </div>

  </div>
</section>
