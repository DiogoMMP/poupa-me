<div class="page-container">
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Criar Saída</h1>
      <p class="form-subtitle">Registe uma nova transação de saída</p>
    </div>

    <div *ngIf="vm.isLoading$ | async" class="loading-state">A carregar...</div>

    <form *ngIf="!(vm.isLoading$ | async)" [formGroup]="form" (ngSubmit)="onSubmit()" class="form-content">

      <!-- Data -->
      <div class="form-field">
        <label for="data" class="form-label">Data</label>
        <app-date-picker formControlName="data" placeholder="Selecionar data" [maxDate]="todayIso"></app-date-picker>
      </div>

      <!-- Descrição -->
      <div class="form-field">
        <label for="descricao" class="form-label">Descrição</label>
        <input
          type="text"
          id="descricao"
          formControlName="descricao"
          class="form-input"
          placeholder="Ex: Compra supermercado"
          (blur)="onDescricaoBlur()">
      </div>

      <!-- Valor -->
      <div class="form-field" formGroupName="valor">
        <label class="form-label">Valor</label>
        <app-money-input formControlName="valor" placeholder="Ex: 45.50" [min]="0.01"></app-money-input>
      </div>

      <!-- Categoria -->
      <div class="form-field">
        <label class="form-label">Categoria</label>
        <app-select formControlName="categoriaId" placeholder="Selecione uma categoria"
          [options]="(vm.categorias$ | async | toSelectOptions)"></app-select>
      </div>

      <!-- Conta -->
      <div class="form-field">
        <label class="form-label">Conta</label>
        <app-select formControlName="contaId" placeholder="Selecione uma conta"
          [options]="(vm.contas$ | async | toSelectOptions)"></app-select>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="form.invalid || (vm.isLoading$ | async)">
          <app-icon name="FloppyDisk" [size]="16" class="svg-icon"></app-icon>
          <span>Guardar</span>
        </button>

        <button type="button" routerLink="/transacoes" class="btn-secondary">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
