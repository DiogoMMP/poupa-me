<div class="page-container">
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Editar Regra</h1>
      <p class="form-subtitle">Atualize as informações da despesa recorrente</p>
    </div>

    <div *ngIf="vm.isLoading$ | async" class="loading-state">A carregar...</div>

    <form *ngIf="!(vm.isLoading$ | async)" [formGroup]="form" (ngSubmit)="onSubmit()" class="form-content">

      <!-- Nome -->
      <div class="form-field">
        <label for="nome" class="form-label">Nome</label>
        <input
          type="text"
          id="nome"
          formControlName="nome"
          class="form-input"
          placeholder="Ex: Netflix">
      </div>

      <!-- Ícone -->
      <div class="form-field">
        <label for="icon" class="form-label">Ícone</label>
        <div class="emoji-input-group">
          <input
            type="text"
            id="icon"
            formControlName="icon"
            class="form-input"
            placeholder="Emoji da despesa"
            readonly>
          <button type="button" class="emoji-btn" (click)="toggleEmojiPicker()" title="Escolher emoji">
            <span class="emoji-btn-icon">{{ form.get('icon')?.value || '😀' }}</span>
          </button>
        </div>

        <!-- Picmo Emoji Picker Modal -->
        <div *ngIf="showEmojiPicker" class="emoji-modal-backdrop" (click)="closeEmojiPicker()">
          <div class="emoji-modal" (click)="$event.stopPropagation()">
            <div class="emoji-modal-header">
              <h3 class="emoji-modal-title">Escolha um Emoji</h3>
              <button type="button" class="emoji-modal-close" (click)="closeEmojiPicker()">✕</button>
            </div>
            <div class="emoji-modal-body">
              <div #emojiPickerContainer class="picmo-container"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tipo -->
      <div class="form-field">
        <label class="form-label">Tipo</label>
        <app-select formControlName="tipo" [options]="tipoOptions"></app-select>
      </div>

      <!-- Categoria -->
      <div class="form-field">
        <label class="form-label">Categoria</label>
        <app-select formControlName="categoriaId" placeholder="Selecione uma categoria"
          [options]="(vm.categorias$ | async | toSelectOptions)"></app-select>
      </div>

      <!-- Imediata -->
      <div class="form-field">
        <label class="form-label">Imediata</label>
        <div class="selection-list">
          <div class="selection-row">
            <label>
              <input type="checkbox" formControlName="imediata" />
              <span class="selection-label">Regra imediata</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Conta Origem -->
      <div class="form-field">
        <label class="form-label">Conta de Origem</label>
        <app-select formControlName="contaOrigemId" placeholder="Selecione uma conta"
          [options]="(vm.contas$ | async | toSelectOptions)"></app-select>
      </div>

      <!-- Conta Destino -->
      <div class="form-field" *ngIf="!isImediata">
        <label class="form-label">Conta de Destino</label>
        <app-select formControlName="contaDestinoId" placeholder="Selecione uma conta"
          [options]="(vm.contas$ | async | toSelectOptions)"></app-select>
      </div>

      <!-- Conta Poupança (só aparece quando tipo = Poupança) -->
      <div class="form-field" *ngIf="isPoupanca">
        <label class="form-label">Conta Poupança</label>
        <app-select formControlName="contaPoupancaId" placeholder="Selecione a conta poupança"
          [options]="(vm.contas$ | async | toSelectOptions)"></app-select>
      </div>

      <!-- Repetição semanal -->
      <div class="form-field" *ngIf="isDespesaSemanal">
        <label for="diaDaSemana" class="form-label">
          Dia da Semana
          <span class="form-label-hint">(opcional - pode preencher mais tarde)</span>
        </label>
        <app-select formControlName="diaDaSemana" placeholder="Selecione o dia da semana"
          [options]="diaDaSemanaOptions"></app-select>
      </div>

      <!-- Dia do Mês -->
      <div class="form-field" *ngIf="isDespesaMensal || isDespesaAnual || isPoupanca">
        <label for="diaDoMes" class="form-label">
          Dia do Mês
          <span class="form-label-hint">(opcional - pode preencher mais tarde)</span>
        </label>
        <input
          type="number"
          id="diaDoMes"
          formControlName="diaDoMes"
          class="form-input"
          placeholder="Ex: 15"
          min="1"
          max="31">
      </div>

      <!-- Mês -->
      <div class="form-field" *ngIf="isDespesaAnual">
        <label for="mes" class="form-label">
          Mês
          <span class="form-label-hint">(opcional - pode preencher mais tarde)</span>
        </label>
        <input
          type="number"
          id="mes"
          formControlName="mes"
          class="form-input"
          placeholder="Ex: 12"
          min="1"
          max="12">
      </div>

      <!-- Valor (opcional) -->
      <div class="form-field" formGroupName="valor">
        <label class="form-label">
          Valor
          <span class="form-label-hint">(opcional — pode preencher mais tarde)</span>
        </label>
        <div class="row-controls">
          <input
            type="number"
            id="valorValor"
            formControlName="valor"
            class="form-input"
            placeholder="Ex: 9.99">
          <input
            type="text"
            id="valorMoeda"
            formControlName="moeda"
            class="form-input">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="form.invalid || (vm.isLoading$ | async)">
          <app-icon name="FloppyDisk" [size]="16"></app-icon>
          <span>Guardar</span>
        </button>
        <button type="button" routerLink="/despesas-recorrentes/listar-regras" class="btn-secondary">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
