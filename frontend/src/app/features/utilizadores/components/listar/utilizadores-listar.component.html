<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Utilizadores</h1>
  </div>

  <div *ngIf="isLoading$ | async" class="loading-state">Loading...</div>

  <div *ngIf="!(isLoading$ | async)" class="content-container">
    <ng-container *ngIf="(users$ | async) as users">
      <div *ngIf="users.length === 0" class="empty-state">
        <p>No users found.</p>
      </div>

      <div *ngIf="users.length > 0" class="cards-grid">
        <div *ngFor="let u of users" class="card card--hover">
          <div class="card-icon-wrapper">
            <div class="card-icon card-icon--circle">
              <!-- user svg icon -->
              <app-icon name="CircleUser" [size]="50" aria-hidden="true"></app-icon>
            </div>
          </div>

          <div class="card-content">
            <h3 class="card-title">{{ u.nome }}</h3>
            <div class="card-meta">
              <div class="text-muted">{{ u.email }}</div>
              <span class="role-badge"
                [class.role-badge--admin]="u.role.toLowerCase() === 'admin'"
                [class.role-badge--user]="u.role.toLowerCase() === 'user'"
                [class.role-badge--default]="u.role.toLowerCase() !== 'admin' && u.role.toLowerCase() !== 'user'">
                {{ u.role }}
              </span>
            </div>
          </div>

          <div class="card-actions">
            <button (click)="toggleRole(u.email, u.role)" class="btn-action" title="Toggle role">
              <app-icon name="SwitchHorizontal" [size]="16" class="svg-icon"></app-icon>
              <span>{{ u.role.toLowerCase() === 'admin' ? 'Tornar User' : 'Tornar Admin' }}</span>
            </button>

            <button (click)="deleteUser(u.email)" class="btn-delete">
              <app-icon name="Trash" [size]="24" class="svg-icon"></app-icon>
              <span>Eliminar</span>
            </button>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>
